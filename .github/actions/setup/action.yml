name: Set up the workspace
description: pnpm, Node and a frozen install. Shared by every workflow so they resolve the same tree.

inputs:
  registry-url:
    description: Passed to setup-node, which writes an .npmrc for it. Only the release sets it.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Reads the version from the root `packageManager` field, so CI and a laptop resolve the
    # same tree.
    - uses: pnpm/action-setup@v5

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    # Frozen: a lockfile that does not match the manifests fails the run rather than quietly
    # resolving something newer.
    - run: pnpm install --frozen-lockfile
      shell: bash
