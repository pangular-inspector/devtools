name: Release

# Publishes @pangular-inspector/devtools to npm from a version tag, with provenance, after checking
# the exact tarball it publishes. Push a tag such as v1.0.0 on a commit of main whose CI passed, or
# run it from the Actions tab with that tag picked as the ref. See
# apps/docs/src/content/contributing/publishing.md#releasing.
on:
  push:
    tags: ['v*']
  # Run with "Use workflow from" set to the tag; a branch is refused.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One release at a time, and never cancelled halfway through a publish.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Protect this environment (required reviewers, tags only) in the repository settings. It holds
    # the NPM_TOKEN secret.
    environment: npm
    permissions:
      # gh release create
      contents: write
      # npm publish --provenance signs the attestation with the workflow's OIDC token.
      id-token: write
      # gh run list reads the CI runs of the tagged commit.
      actions: read
    env:
      # Both triggers run on the tag itself: a tag push, or a manual run with the tag as the ref.
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check the run is for a tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Release runs only on a version tag, not on ${GITHUB_REF}. Pick the tag in \"Use workflow from\"."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          # The whole history, so the tagged commit can be checked against main.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG points at $(git rev-parse --short HEAD), which is not on main. Release from main only."
            exit 1
          fi

      # The full CI (ci.yml) must have passed on main for this exact commit, so a commit whose CI
      # failed, or is still running, is never published.
      - name: Check CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          passed=$(gh run list --workflow ci.yml --commit "$sha" --branch main --event push \
            --status success --json databaseId -q 'length > 0')
          if [ "$passed" != "true" ]; then
            echo "::error::CI has no successful run on main for $sha. Wait for it to pass, or fix main and tag again."
            exit 1
          fi

      # The tag, the package version and the changelog section must agree. The section becomes the
      # GitHub release notes.
      - name: Check the version and the changelog
        run: node scripts/release-notes.mjs --tag="$TAG" --out="$RUNNER_TEMP/release-notes.md"

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - name: Type-check
        run: pnpm typecheck

      - name: Test devtools package
        run: pnpm test:devtools

      - name: Test devtools panel
        run: pnpm test:panel

      # `prepack` builds the library and the panel. The root .pnpmfile.cjs drops the workspace-only
      # fields from the packed package.json. Everything after this step uses this one file.
      - name: Pack the tarball
        id: pack
        run: |
          mkdir -p dist/release
          pnpm --filter @pangular-inspector/devtools pack --pack-destination "$PWD/dist/release"
          tarball=$(ls "$PWD"/dist/release/*.tgz)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Packed $(basename "$tarball")" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Both publish the tarball to a throwaway local registry, never to npm.
      - name: Verify the tarball (Angular CLI)
        run: pnpm verify:publish --scenario=angular-cli --tarball="${{ steps.pack.outputs.tarball }}"

      - name: Verify the tarball (Analog)
        run: pnpm verify:publish --scenario=analog --tarball="${{ steps.pack.outputs.tarball }}"

      # A small slice of the weekly install matrix (e2e.yml), plus the package audit.
      - name: Install matrix on the tarball
        run: >-
          pnpm e2e:install --tarball="${{ steps.pack.outputs.tarball }}"
          --cells=angular-cli:npm:22,angular-cli:pnpm:20.3,angular-cli-nossr:npm:22,analog:pnpm,cli:npm
          --report=dist/release/e2e-install.json --logs=dist/release/e2e-install-logs

      - name: Keep the tarball and the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.TAG }}
          path: dist/release
          if-no-files-found: ignore

      # A version with a prerelease part (1.1.0-rc.1) goes to the `next` dist-tag, so `latest`
      # only ever moves to a stable release.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          case "$TAG" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish "$TARBALL" --provenance --access public --tag "$dist_tag"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" "$TARBALL" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}"
