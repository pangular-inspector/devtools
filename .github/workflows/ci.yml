name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # nx-set-shas reads previous workflow runs to find the last green main commit
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: nrwl/nx-set-shas@v4

      - name: Check formatting
        run: pnpm format:check

      - name: Validate agent skills and roles
        run: pnpm skills:check

      - name: Type-check
        run: pnpm typecheck

      - name: Test and build affected projects
        run: pnpm exec nx affected -t test build

      - name: Test devtools package
        run: pnpm test:devtools

      - name: Test devtools panel
        run: pnpm test:panel

      - name: Build Chrome extension
        run: pnpm extension:build

      - name: Check committed build output is current
        run: |
          stale=$(git status --porcelain -- extension/ui)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::Committed build output is stale. Run 'pnpm extension:build' and commit the result."
            exit 1
          fi

      - name: Smoke-test the CLI
        run: node bin.mjs --help

  node-22:
    name: Package tests on Node.js 22
    # `engines.node` allows 22.12 and later, while the build job runs the `.nvmrc` version.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: 22

      - name: Test devtools package
        run: pnpm test:devtools

  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check the panel with axe
        run: pnpm test:axe

  # The e2e jobs below are slow, so they run only when the package, the panel, the SSR demo, the
  # tools docs (e2e:mcp reads them) or the scripts and fixtures they use change. A diff that cannot
  # be computed (a new branch, a force push) runs them.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          paths=(packages/devtools app e2e src apps/docs/src/content/agents angular.json package.json
            scripts/e2e-security.mjs scripts/e2e-mcp.mjs pnpm-lock.yaml .github/workflows/ci.yml)
          if git diff --quiet "$BASE" HEAD -- "${paths[@]}"; then
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          fi

  e2e-security:
    name: Security e2e
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Playwright's own Chromium, as the axe job installs it.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the package
        run: pnpm devtools:build-pkg

      # Leak corpus, access gates and a production build, on ports 5231 to 5236.
      - name: Check redaction and access
        run: pnpm e2e:security

      - name: Keep the captured channels
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-security
          path: dist/e2e-security
          if-no-files-found: ignore

  e2e-mcp:
    name: MCP e2e
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Builds the package and the SSR demo itself, then serves the demo on port 5150 (the variant
      # hubs on 5151 to 5154) and checks every tool, resource and prompt, and agents/tools.md.
      - name: Check the agent surface
        run: pnpm e2e:mcp --report dist/e2e-mcp/report.json

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mcp
          path: dist/e2e-mcp
          if-no-files-found: ignore
