name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # nx-set-shas reads previous workflow runs to find the last green main commit
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Test and build affected projects
        run: pnpm exec nx affected -t test build

      - name: Test devtools package
        run: pnpm test:devtools

      - name: Build Chrome extension
        run: pnpm extension:build

      - name: Check committed build output is current
        run: |
          stale=$(git status --porcelain -- extension/ui)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::Committed build output is stale. Run 'pnpm extension:build' and commit the result."
            exit 1
          fi

      - name: Smoke-test the CLI
        run: node bin.mjs --help
