<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pangular Inspector</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        --bg: #0f0f11;
        --text: #a1a1aa;
        --text-strong: #d4d4d8;
        --accent: #f5a524;
        --accent-ink: #0f0f11;
        color-scheme: dark;
      }
      html[data-theme='light'] {
        --bg: #ffffff;
        --text: #52525b;
        --text-strong: #18181b;
        --accent: #92400e;
        --accent-ink: #ffffff;
        color-scheme: light;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      .status {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        height: 100%;
        padding: 16px;
        color: var(--text);
        font-family: system-ui, sans-serif;
        font-size: 14px;
        text-align: center;
      }
      .status.hidden {
        display: none;
      }
      .status ul {
        list-style: none;
        color: var(--text-strong);
        font-family: ui-monospace, monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .status button {
        padding: 6px 12px;
        border: none;
        border-radius: 4px;
        background: var(--accent);
        color: var(--accent-ink);
        font: inherit;
        cursor: pointer;
      }
      .status a {
        color: var(--accent);
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      main {
        height: 100%;
      }
      .status :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">Pangular Inspector</h1>
      <div id="status" class="status" role="status">
        <p id="status-message">Detecting Angular app…</p>
        <ul id="status-tried" aria-label="URLs tried" hidden></ul>
        <button id="status-allow" type="button" hidden>Allow access</button>
        <button id="status-retry" type="button" hidden>Try again</button>
        <a
          id="status-docs"
          href="https://github.com/pangular-inspector/devtools#get-started"
          target="_blank"
          rel="noreferrer"
          hidden
          >Set up the devtools server</a
        >
      </div>
      <iframe id="devtools-frame" style="display: none"></iframe>
    </main>
    <script src="panel-actions.js"></script>
    <script src="panel-bridge.js"></script>
  </body>
</html>
