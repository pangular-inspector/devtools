<ActionBar title="Details">
  @if (isAndroid) {
    <StackLayout orientation="horizontal" horizontalAlignment="left">
      <Label
        text="< Back"
        color="#1976d2"
        (tap)="goBack()"
        style="font-size: 18; margin-left: 4"
      ></Label>
      <Label
        text="Details"
        color="#333"
        style="font-size: 20; font-weight: 600; margin-left: 30"
      ></Label>
    </StackLayout>
  }
</ActionBar>

@if (person(); as p) {
  <FlexboxLayout flexDirection="column">
    <FlexboxLayout class="m-4">
      <Label class="text-3xl text-gray-400" [text]="p.id + '. '"></Label>
      <Label class="text-3xl" [text]="p.name"></Label>
    </FlexboxLayout>

    <StackLayout class="text-xl m-2 ml-6">
      <Label class="mb-2" fontWeight="700" text="Nationality:"></Label>
      <Label textWrap="true" [text]="p.nationality"></Label>
    </StackLayout>

    <StackLayout class="text-xl m-2">
      <Label class="m-2 ml-4" fontWeight="700" text="Notable Achievements:"></Label>
      <Label
        class="text-xl m-2 ml-4"
        [text]="formatAchievements(p.notableAchievements)"
        textWrap="true"
      >
      </Label>
    </StackLayout>
  </FlexboxLayout>
} @else {
  <Label class="text-xl text-gray-500 m-4" text="Person not found."></Label>
}
