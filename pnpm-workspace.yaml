packages:
  - packages/*
  - examples/*
  - '!examples/angular-native'
  - apps/*
  # Installs with npm from its own lockfile, outside the root install.
  - '!examples/nativescript'

packageExtensions:
  '@analogjs/vite-plugin-nitro':
    dependencies:
      h3: ^1.15.0
patchedDependencies:
  '@devframes/agentic@1.2.3': patches/@devframes__agentic@1.2.3.patch
  '@devframes/hub@1.2.3': patches/@devframes__hub@1.2.3.patch
  devframe@1.2.3: patches/devframe@1.2.3.patch
